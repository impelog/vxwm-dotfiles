#################################
#           Backend             #
#################################
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;

# Fix flickering on desktop click / focus switch
unredir-if-possible = false;
use-damage = false;
use-ewmh-active-win = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
detect-transient = true;

#################################
#          Animations           #
#################################
animations = true;

# Speed & dynamics for windows in current tag (e.g. opening terminal)
animation-stiffness-in-tag = 145;

# Speed when changing tags / workspaces
animation-stiffness-tag-change = 110.0;

# Window mass (gives smooth physical inertia)
animation-window-mass = 0.5;

# Spring dampening (controls bounce)
animation-dampening = 14;

# Enable slight, elegant spring bounce (false = bounce allowed)
animation-clamping = false;

# Open window: smooth spring zoom
animation-for-open-window = "zoom";

# Close / unmap window: smooth squeeze
animation-for-unmap-window = "squeeze";

# Popups & dropdowns: slide up
animation-for-transient-window = "slide-up";

# Tag switching transitions
animation-for-prev-tag = "minimize";
enable-fading-prev-tag = true;

animation-for-next-tag = "slide-in-center";
enable-fading-next-tag = true;

#################################
#             Fading            #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
no-fading-openclose = false;

#################################
#            Corners            #
#################################
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];

#################################
#            Shadows            #
#################################
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#            Opacity            #
#################################
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

#################################
#        Window Types           #
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = true; };
  dropdown_menu = { opacity = 1.0; shadow = true; };
};
