# LightDM Mini Greeter Configuration (dmenu style)

[greeter]
# User to login as
user = plugwalk
show-password-label = true
password-label-text = plugwalk:
invalid-password-text = Invalid Password
show-input-cursor = true
password-alignment = left
password-input-width = 20
show-image-on-all-monitors = false

[greeter-hotkeys]
mod-key = meta
shutdown-key = s
restart-key = r
hibernate-key = h
suspend-key = u

[greeter-theme]
font = "monospace"
font-size = 1em
font-weight = normal
font-style = normal
text-color = "#bbbbbb"
error-color = "#cc3333"
background-image = ""
background-color = "#222222"
window-color = "#222222"
border-color = "#005577"
border-width = 2px
layout-space = 15
password-character = -1
password-color = "#eeeeee"
password-background-color = "#222222"
password-border-color = "#005577"
password-border-width = 2px
password-border-radius = 0px
