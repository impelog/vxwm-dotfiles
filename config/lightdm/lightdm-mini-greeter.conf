# LightDM Mini Greeter Configuration (dmenu style)

[greeter]
user = plugwalk
show-password-label = true
password-label-text = plugwalk:
invalid-password-text = Invalid Password
show-input-cursor = true
password-alignment = left
password-input-width = 20
show-image-on-all-monitors = false

[greeter-hotkeys]
mod-key = meta
shutdown-key = s
restart-key = r
hibernate-key = h
suspend-key = u

[greeter-theme]
font = "monospace"
font-size = 1em
font-weight = normal
font-style = normal
text-color = "#e4dfd5"
error-color = "#b86847"
background-image = "/usr/share/backgrounds/shishkin.jpg"
background-color = "#1c1917"
window-color = "#1c1917"
border-color = "#d49b42"
border-width = 2px
layout-space = 15
password-character = -1
password-color = "#e4dfd5"
password-background-color = "#24201c"
password-border-color = "#d49b42"
password-border-width = 2px
password-border-radius = 0px
